name: Build MiyooPod ARM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout modified MiyooPod
        uses: actions/checkout@v4
        with:
          path: modified
          fetch-depth: 1

      - name: Checkout Miyoo SDL2 environment
        uses: actions/checkout@v4
        with:
          repository: XK9274/sdl2_miyoo
          path: sdl2_miyoo
          fetch-depth: 1

      - name: Checkout upstream MiyooPod
        uses: actions/checkout@v4
        with:
          repository: danfragoso/miyoopod
          path: upstream
          fetch-depth: 1

      - name: Build Miyoo SDL2 environment
        working-directory: sdl2_miyoo
        run: |
          docker build -t mmiyoo .

      - name: Extract Miyoo toolchain from Docker image
        run: |
          CONTAINER_ID=$(docker create mmiyoo)
          docker cp "$CONTAINER_ID:/opt/mmiyoo" ./mmiyoo
          docker cp "$CONTAINER_ID:/opt/prebuilt" ./prebuilt || true
          docker rm "$CONTAINER_ID"

      - name: Prepare MiyooPod build environment
        run: |
          sudo mkdir -p /root/include
          sudo mkdir -p /root/lib

          sudo cp -r mmiyoo/arm-buildroot-linux-gnueabihf/sysroot/usr/include/SDL2 /root/include/

          if [ -d prebuilt ]; then
            sudo cp -r prebuilt/* /root/lib/ || true
          fi

          sudo chmod 755 /root
          sudo chmod -R a+rX /root/include
          sudo chmod -R a+rX /root/lib

          mkdir -p modified/App/MiyooPod
          cp -r upstream/App/MiyooPod/* modified/App/MiyooPod/

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download Go dependencies
        working-directory: modified
        run: go mod download

      - name: Configure Miyoo compiler
        run: |
          echo "$GITHUB_WORKSPACE/mmiyoo/bin" >> "$GITHUB_PATH"

      - name: Build modified MiyooPod
        working-directory: modified
        env:
          CC: ${{ github.workspace }}/mmiyoo/bin/arm-linux-gnueabihf-gcc
          CGO_ENABLED: '1'
          GOARCH: arm
          GOOS: linux
        run: make go

      - name: Verify ARM binary
        run: |
          file modified/App/MiyooPod/MiyooPod
          test -f modified/App/MiyooPod/MiyooPod

      - name: Prepare release package
        run: |
          mkdir -p package/MiyooPod
          cp -r modified/App/MiyooPod/* package/MiyooPod/

      - name: Package MiyooPod
        run: |
          cd package
          zip -r ../MiyooPod-Artist-Album-mod.zip MiyooPod

      - name: Upload ready-to-use MiyooPod
        uses: actions/upload-artifact@v4
        with:
          name: MiyooPod-Artist-Album-mod
          path: MiyooPod-Artist-Album-mod.zip
          if-no-files-found: error
