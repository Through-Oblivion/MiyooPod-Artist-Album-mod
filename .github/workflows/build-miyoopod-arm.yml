name: Build MiyooPod ARM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout modified MiyooPod
        uses: actions/checkout@v4
        with:
          path: modified
          fetch-depth: 1

      - name: Checkout Miyoo SDL2
        uses: actions/checkout@v4
        with:
          repository: XK9274/sdl2_miyoo
          path: sdl2_miyoo
          fetch-depth: 1

      - name: Checkout upstream MiyooPod
        uses: actions/checkout@v4
        with:
          repository: danfragoso/miyoopod
          path: upstream
          fetch-depth: 1

      - name: Fix old Debian Buster repositories
        working-directory: sdl2_miyoo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Dockerfile")
          text = p.read_text()

          text = text.replace(
              "FROM debian:buster\n",
              """FROM debian:buster

          RUN sed -i 's|deb.debian.org/debian|archive.debian.org/debian|g' /etc/apt/sources.list && \
              sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' /etc/apt/sources.list && \
              printf 'Acquire::Check-Valid-Until "false";\\n' > /etc/apt/apt.conf.d/99no-check-valid-until

          """
          )

          text = text.replace(
              "https://github.com/steward-fu/nds_miyoo/releases/download/assets/toolchain.tar.gz",
              "https://github.com/steward-fu/website/releases/download/miyoo-mini-plus/toolchain.tar.gz"
          )

          p.write_text(text)
          PY

          echo "===== FINAL DOCKERFILE ====="
          cat Dockerfile
          echo "============================"

      - name: Build Miyoo SDL2 Docker image
        working-directory: sdl2_miyoo
        run: |
          docker build --network=host -t mmiyoo .

      - name: Build Miyoo SDL2 libraries
        working-directory: sdl2_miyoo
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/sdl2_miyoo:/nds_miyoo" \
            mmiyoo \
            /bin/bash -c "cd /nds_miyoo && make sdl2"

      - name: Inspect SDL2 build output
        working-directory: sdl2_miyoo
        run: |
          echo "===== SDL2 files ====="
          find . -type f \( \
            -name 'SDL.h' -o \
            -name '_real_SDL_config.h' -o \
            -name 'libSDL2.so*' -o \
            -name 'libSDL2.a' -o \
            -name 'libSDL2_mixer.so*' -o \
            -name 'libSDL2_mixer.a' \
          \) -print
          echo "======================"

      - name: Extract Miyoo toolchain
        run: |
          CONTAINER_ID=$(docker create mmiyoo)

          docker cp "$CONTAINER_ID:/opt/mmiyoo" ./mmiyoo
          docker cp "$CONTAINER_ID:/opt/prebuilt" ./prebuilt || true

          docker rm "$CONTAINER_ID"

      - name: Prepare MiyooPod SDL2 environment
        run: |
          sudo mkdir -p /root/include
          sudo mkdir -p /root/lib

          echo "Searching for SDL2 headers..."

          SDL2_DIR=$(find "$GITHUB_WORKSPACE/sdl2_miyoo" \
            -type d \
            -path '*/include/SDL2' \
            | head -n 1)

          if [ -n "$SDL2_DIR" ]; then
            echo "Found SDL2 headers: $SDL2_DIR"
            sudo cp -r "$SDL2_DIR" /root/include/
          else
            echo "ERROR: SDL2 headers were not found"
            exit 1
          fi

          echo "Searching for SDL2 libraries..."

          find "$GITHUB_WORKSPACE/sdl2_miyoo" \
            -type f \
            \( \
              -name 'libSDL2.so*' -o \
              -name 'libSDL2.a' -o \
              -name 'libSDL2_mixer.so*' -o \
              -name 'libSDL2_mixer.a' \
            \) \
            -exec sudo cp {} /root/lib/ \;

          sudo chmod 755 /root
          sudo chmod -R a+rX /root/include
          sudo chmod -R a+rX /root/lib

          echo "===== /root/include/SDL2 ====="
          find /root/include/SDL2 -maxdepth 1 -type f | sort

          echo "===== /root/lib ====="
          find /root/lib -maxdepth 1 -type f | sort

          echo "===== Checking required config ====="
          test -f /root/include/SDL2/_real_SDL_config.h

      - name: Prepare MiyooPod application files
        run: |
          mkdir -p modified/App/MiyooPod
          cp -r upstream/App/MiyooPod/* modified/App/MiyooPod/

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download Go dependencies
        working-directory: modified
        run: |
          go mod download

      - name: Configure Miyoo ARM compiler
        run: |
          COMPILER=$(find "$GITHUB_WORKSPACE/mmiyoo" \
            -type f \
            -name 'arm-linux-gnueabihf-gcc' \
            | head -n 1)

          if [ -z "$COMPILER" ]; then
            echo "ERROR: Miyoo ARM compiler not found"
            exit 1
          fi

          echo "Using compiler:"
          echo "$COMPILER"

          echo "CC=$COMPILER" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "GOARCH=arm" >> "$GITHUB_ENV"
          echo "GOOS=linux" >> "$GITHUB_ENV"

      - name: Build modified MiyooPod
        working-directory: modified
        run: |
          make go

      - name: Verify ARM binary
        run: |
          file modified/App/MiyooPod/MiyooPod
          test -f modified/App/MiyooPod/MiyooPod

      - name: Package MiyooPod
        run: |
          mkdir -p package/MiyooPod

          cp -r modified/App/MiyooPod/* package/MiyooPod/

          cd package
          zip -r ../MiyooPod-Artist-Album-mod.zip MiyooPod

      - name: Upload ready-to-use MiyooPod
        uses: actions/upload-artifact@v4
        with:
          name: MiyooPod-Artist-Album-mod
          path: MiyooPod-Artist-Album-mod.zip
          if-no-files-found: error
