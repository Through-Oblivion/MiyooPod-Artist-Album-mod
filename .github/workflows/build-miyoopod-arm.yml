name: Build MiyooPod ARM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout modified MiyooPod
        uses: actions/checkout@v4
        with:
          path: modified
          fetch-depth: 1

      - name: Checkout Miyoo SDL2 environment
        uses: actions/checkout@v4
        with:
          repository: XK9274/sdl2_miyoo
          path: sdl2_miyoo
          fetch-depth: 1

      - name: Checkout upstream MiyooPod
        uses: actions/checkout@v4
        with:
          repository: danfragoso/miyoopod
          path: upstream
          fetch-depth: 1

      - name: Fix Debian Buster sources inside Dockerfile
        working-directory: sdl2_miyoo
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Dockerfile")
          text = p.read_text()

          text = text.replace(
              "FROM debian:buster\n",
              """FROM debian:buster

          RUN sed -i 's|deb.debian.org/debian|archive.debian.org/debian|g' /etc/apt/sources.list && \\
              sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' /etc/apt/sources.list && \\
              printf 'Acquire::Check-Valid-Until "false";\\n' > /etc/apt/apt.conf.d/99no-check-valid-until

          """
          )

          p.write_text(text)
          PY

          echo "===== Dockerfile ====="
          cat Dockerfile
          echo "======================"

      - name: Build Miyoo SDL2 toolchain
        working-directory: sdl2_miyoo
        run: |
          docker build --network=host -t mmiyoo .

      - name: Extract Miyoo toolchain
        run: |
          CONTAINER_ID=$(docker create mmiyoo)

          docker cp "$CONTAINER_ID:/opt/mmiyoo" ./mmiyoo

          docker rm "$CONTAINER_ID"

          echo "===== Toolchain ====="
          find mmiyoo -maxdepth 3 -type d | head -100
          echo "====================="

      - name: Prepare MiyooPod build environment
        run: |
          sudo mkdir -p /root/include
          sudo mkdir -p /root/lib

          if [ -d "mmiyoo/include/SDL2" ]; then
            sudo cp -r mmiyoo/include/SDL2 /root/include/
          fi

          if [ -d "mmiyoo/usr/include/SDL2" ]; then
            sudo cp -r mmiyoo/usr/include/SDL2 /root/include/
          fi

          if [ -d "mmiyoo/lib" ]; then
            sudo cp -r mmiyoo/lib/* /root/lib/ || true
          fi

          if [ -d "mmiyoo/usr/lib" ]; then
            sudo cp -r mmiyoo/usr/lib/* /root/lib/ || true
          fi

          sudo chmod 755 /root
          sudo chmod -R a+rX /root/include
          sudo chmod -R a+rX /root/lib

          mkdir -p modified/App/MiyooPod
          cp -r upstream/App/MiyooPod/* modified/App/MiyooPod/

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Download Go dependencies
        working-directory: modified
        run: |
          go mod download

      - name: Find Miyoo ARM compiler
        run: |
          echo "Searching for ARM compiler..."
          find mmiyoo -type f -name 'arm-linux-gnueabihf-gcc' -print

      - name: Build modified MiyooPod
        working-directory: modified
        run: |
          make go

      - name: Verify ARM binary
        run: |
          file modified/App/MiyooPod/MiyooPod
          test -f modified/App/MiyooPod/MiyooPod

      - name: Package MiyooPod
        run: |
          mkdir -p package/MiyooPod
          cp -r modified/App/MiyooPod/* package/MiyooPod/

          cd package
          zip -r ../MiyooPod-Artist-Album-mod.zip MiyooPod

      - name: Upload ready-to-use MiyooPod
        uses: actions/upload-artifact@v4
        with:
          name: MiyooPod-Artist-Album-mod
          path: MiyooPod-Artist-Album-mod.zip
          if-no-files-found: error
