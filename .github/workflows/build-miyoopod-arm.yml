name: Build MiyooPod ARM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout modified source
        uses: actions/checkout@v4
        with:
          path: modified

      - name: Checkout upstream runtime files
        uses: actions/checkout@v4
        with:
          repository: danfragoso/miyoopod
          path: upstream

      - name: Install ARM compiler
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Prepare MiyooPod app directory
        run: |
          mkdir -p modified/app
          cp -r upstream/app/* modified/app/

      - name: Download Go dependencies
        working-directory: modified
        run: go mod download

      - name: Build modified MiyooPod
        working-directory: modified
        env:
          GOARM: '7'
        run: make go

      - name: Verify ARM binary
        run: |
          file modified/app/miyoopod
          test -f modified/app/miyoopod

      - name: Package app
        run: |
          mkdir -p package/MiyooPod
          cp -r modified/app/* package/MiyooPod/
          cd package
          zip -r ../MiyooPod-Artist-Album-mod.zip MiyooPod

      - name: Upload ready-to-use MiyooPod
        uses: actions/upload-artifact@v4
        with:
          name: MiyooPod-Artist-Album-mod
          path: MiyooPod-Artist-Album-mod.zip
